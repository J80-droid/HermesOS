# HermesOS: Windows desktop installers + ondertekende updater-artifacts
#
# Vereiste repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY            — minisign private key (inclusief comment-header)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — optioneel; leeg laten als de key onbeveiligd is
#
# Getriggerd op git-tags `v*` en handmatig via workflow_dispatch (tag moet al bestaan).

name: HermesOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande git-tag om te bouwen (bv. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hermesos-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installers:
    name: Build HermesOS (Windows)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: HermesOS/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies (editable + web UI deps)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[web]" pyinstaller

      - name: Export embedded dashboard metadata (Rust include_str!)
        run: |
          python HermesOS/scripts/export_config_metadata.py
          python HermesOS/scripts/export_env_metadata.py

      - name: Build PyInstaller sidecar
        run: python HermesOS/scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: HermesOS
        run: pnpm install --frozen-lockfile

      - name: Frontend production build (Vite)
        working-directory: HermesOS
        run: pnpm run build

      - name: Tauri bundle (MSI + NSIS + signed updater artifacts)
        working-directory: HermesOS
        run: pnpm exec tauri build --ci

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: HermesOS ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            HermesOS/src-tauri/target/release/bundle/msi/*.msi
            HermesOS/src-tauri/target/release/bundle/nsis/*.exe
            HermesOS/src-tauri/target/release/**/*.sig
